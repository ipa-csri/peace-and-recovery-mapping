<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>P&R Map — Label Editor</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Arial, sans-serif; background: #f1f2f2; color: #414042; min-height: 100vh; }
  #app { display: flex; flex-direction: column; height: 100vh; }

  #header { background: #155240; color: #fff; padding: 10px 20px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; gap: 12px; }
  #header h1 { font-family: Georgia, serif; font-size: 16px; font-weight: normal; }
  #header .note { font-size: 11px; opacity: 0.7; }
  .btn { background: #fff; color: #155240; border: none; border-radius: 3px; padding: 6px 14px; font-size: 12px; cursor: pointer; font-weight: bold; }
  .btn:hover { background: #f1f2f2; }
  .btn-outline { background: transparent; color: #fff; border: 1px solid rgba(255,255,255,0.5); }
  .btn-outline:hover { background: rgba(255,255,255,0.1); color: #fff; }

  #map-wrap { flex: 1; position: relative; overflow: hidden; }
  #map-svg { width: 100%; height: 100%; display: block; cursor: default; }

  .country           { fill: #e8e5e0; }
  .country.highlighted { fill: #b0aba0; }   /* same darker tone as interactive */
  .connector   { stroke: #555; stroke-width: 0.6; fill: none; opacity: 0.5; }
  .label-text  { font-family: Arial, sans-serif; font-size: 8px; font-weight: bold; fill: #414042; }
  .label-text.dragging { fill: #155240; }
  .label-dot   { fill: #155240; }
  .dot-DLI { fill: #84d0d4; }
  .dot-PRI { fill: #49ac57; }
  .dot-HPI { fill: #f26529; }

  #toolbar { background: #fff; border-top: 1px solid #c9c9c8; padding: 8px 16px; flex-shrink: 0; font-size: 11px; color: #888; }

  #output-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 200; justify-content: center; align-items: center; }
  #output-modal.open { display: flex; }
  #output-box { background: #fff; border-radius: 6px; padding: 20px; width: 600px; max-width: 95vw; max-height: 80vh; display: flex; flex-direction: column; gap: 12px; }
  #output-box h2 { font-size: 14px; color: #155240; }
  #output-box textarea { flex: 1; min-height: 300px; font-family: monospace; font-size: 11px; border: 1px solid #c9c9c8; border-radius: 3px; padding: 8px; resize: vertical; }
  #output-box .row { display: flex; gap: 10px; justify-content: flex-end; }
</style>
</head>
<body>
<div id="app">
  <div id="header">
    <div>
      <h1>P&amp;R Map — Label Position Editor</h1>
      <div class="note">Drag any label to reposition it. Connector lines update live.</div>
    </div>
    <div style="display:flex;gap:8px">
      <button class="btn btn-outline" id="btn-reset">Reset all</button>
      <button class="btn" id="btn-copy">Copy positions</button>
    </div>
  </div>
  <div id="map-wrap">
    <svg id="map-svg" viewBox="0 0 1060 530" preserveAspectRatio="xMidYMid meet"></svg>
  </div>
  <div id="toolbar">💡 Drag labels to reposition · Click "Copy positions" to export the updated F object · Paste into pr_map_interactive.html</div>
</div>

<div id="output-modal">
  <div id="output-box">
    <h2>Updated F object — copy and paste into pr_map_interactive.html</h2>
    <textarea id="output-text" readonly></textarea>
    <div class="row">
      <button class="btn" id="btn-clipboard" style="background:#155240;color:#fff">Copy to clipboard</button>
      <button class="btn" id="btn-close-modal" style="border:1px solid #c9c9c8">Close</button>
    </div>
  </div>
</div>

const ALIAS      = {'Central African Republic':140,'CAR':140,"Côte d'Ivoire":384};
const PANEL_NAME = {'CAR':'Central African Republic'};
const INIT_ORDER = ['DLI','PRI','HPI'];
const INIT_COLORS= {DLI:'#84d0d4',PRI:'#49ac57',HPI:'#f26529'};

let F = JSON.parse(JSON.stringify(F_DEFAULT));
Object.values(F).forEach(c => { c.dx=+c.dx; c.dy=+c.dy; });

const svg = d3.select('#map-svg');
const projection = d3.geoNaturalEarth1().scale(168).translate([530,265]);
const path = d3.geoPath().projection(projection);
const labelPos = {}, centroidPos = {}, labelDomMap = {};

function getSVGPoint(event, svgEl) {
  const pt = svgEl.createSVGPoint();
  pt.x = event.clientX; pt.y = event.clientY;
  const ctm = svgEl.getScreenCTM();
  return ctm ? pt.matrixTransform(ctm.inverse()) : null;
}

fetch('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json')
  .then(r => r.json())
  .then(world => {
    const countries = topojson.feature(world, world.objects.countries);
    const highlighted = new Set(Object.keys(F).map(Number));
    const svgEl = document.getElementById('map-svg');

    svg.append('rect').attr('width',1060).attr('height',530).attr('fill','#cce8f0');
    svg.selectAll('path.country').data(countries.features).join('path')
      .attr('class', d => `country ${highlighted.has(+d.id)?'highlighted':''}`)
      .attr('d',path).attr('stroke','#fff').attr('stroke-width',0.4);
    svg.append('path').datum(d3.geoGraticule()())
       .attr('d',path).attr('fill','none').attr('stroke','#b8dcea').attr('stroke-width',0.3);

    const lg = svg.append('g').attr('id','labels');

    Object.entries(F).forEach(([ns,cfg]) => {
      const feat = countries.features.find(f=>+f.id===+ns);
      if (!feat) return;
      const pkey = PANEL_NAME[cfg.n]||cfg.n;
      const im = PROJECTS[pkey]; if (!im) return;
      const c = path.centroid(feat);
      if (!c||isNaN(c[0])) return;
      const [cx,cy]=c;
      centroidPos[ns]={cx,cy};
      labelPos[ns]={lx:cx+cfg.dx, ly:cy+cfg.dy};

      const g = lg.append('g').attr('data-id',ns).style('cursor','grab');
      let lineEl = null;
      if (!cfg.direct) {
        lineEl = g.append('line').attr('class','connector').attr('x1',cx).attr('y1',cy).attr('x2',cx+cfg.dx).attr('y2',cy+cfg.dy);
        g.append('circle').attr('cx',cx).attr('cy',cy).attr('r',1.5).attr('class','label-dot');
      }
      const textEl = g.append('text').attr('class','label-text')
        .attr('x',cx+cfg.dx).attr('y',cy+cfg.dy)
        .attr('text-anchor',cfg.a).attr('dominant-baseline','middle').text(cfg.n);

      const inits = INIT_ORDER.filter(k=>im[k]?.length);
      const tw = cfg.n.length*4.8;
      const dx0 = cfg.a==='end' ? (cx+cfg.dx)+3 : (cx+cfg.dx)+tw+2;
      const dotEls = inits.map((k,i)=>g.append('circle').attr('cx',dx0+i*6).attr('cy',cy+cfg.dy).attr('r',2.5).attr('class',`dot-${k}`));
      labelDomMap[ns]={g,lineEl,textEl,dotEls,inits,tw};

      let dragStart=null, posStart=null;
      g.on('mousedown', function(event){
        event.preventDefault(); event.stopPropagation();
        const pt = getSVGPoint(event,svgEl); if(!pt) return;
        dragStart={x:pt.x,y:pt.y}; posStart={...labelPos[ns]};
        g.style('cursor','grabbing'); textEl.classed('dragging',true);
        const onMove = e => {
          const mp=getSVGPoint(e,svgEl); if(!mp) return;
          labelPos[ns]={lx:posStart.lx+(mp.x-dragStart.x), ly:posStart.ly+(mp.y-dragStart.y)};
          updateLabel(ns);
        };
        const onUp = () => {
          document.removeEventListener('mousemove',onMove);
          document.removeEventListener('mouseup',onUp);
          g.style('cursor','grab'); textEl.classed('dragging',false);
          const {cx,cy}=centroidPos[ns], {lx,ly}=labelPos[ns];
          F[ns].dx=Math.round(lx-cx); F[ns].dy=Math.round(ly-cy);
        };
        document.addEventListener('mousemove',onMove);
        document.addEventListener('mouseup',onUp);
      });
    });

    function updateLabel(ns) {
      const {lx,ly}=labelPos[ns], {cx,cy}=centroidPos[ns];
      const {lineEl,textEl,dotEls,inits,tw}=labelDomMap[ns];
      const cfg=F[ns];
      if(lineEl) lineEl.attr('x2',lx).attr('y2',ly);
      textEl.attr('x',lx).attr('y',ly);
      const dx0 = cfg.a==='end' ? lx+3 : lx+tw+2;
      dotEls.forEach((d,i)=>d.attr('cx',dx0+i*6).attr('cy',ly));
    }

    document.getElementById('btn-reset').addEventListener('click',()=>{
      F=JSON.parse(JSON.stringify(F_DEFAULT));
      Object.entries(F).forEach(([ns,cfg])=>{
        cfg.dx=+cfg.dx; cfg.dy=+cfg.dy;
        const c=centroidPos[ns]; if(!c) return;
        labelPos[ns]={lx:c.cx+cfg.dx, ly:c.cy+cfg.dy};
        updateLabel(ns);
      });
    });

    document.getElementById('btn-copy').addEventListener('click',()=>{
      const groups=[
        {label:'// AMERICAS',ids:[484,188,222,332,170,152,604,76]},
        {label:'// EUROPE',ids:[724,250,756,276,804]},
        {label:'// MIDDLE EAST',ids:[792,760,422,818,368,400,887]},
        {label:'// SOUTH / CENTRAL ASIA',ids:[4,586,524,356,50]},
        {label:'// SE ASIA',ids:[104,764,608]},
        {label:'// WEST AFRICA',ids:[854,566,204,288,384,430]},
        {label:'// CENTRAL AFRICA',ids:[140,180,646]},
        {label:'// EAST AFRICA',ids:[728,231,706,800,404,508]},
      ];
      let out='const F = {\n';
      groups.forEach(grp=>{
        out+=`  ${grp.label}\n`;
        grp.ids.forEach(num=>{
          const cfg=F[num]; if(!cfg) return;
          const {cx,cy}=centroidPos[String(num)]||{};
          const {lx,ly}=labelPos[String(num)]||{};
          if(!cx) return;
          const dxF=Math.round(lx-cx), dyF=Math.round(ly-cy);
          const dir=cfg.direct?', direct:true':'';
          const pad=' '.repeat(Math.max(0,14-cfg.n.length));
          out+=`  ${String(num).padStart(3)}: { n:'${cfg.n}',${pad}dx:${String(dxF).padStart(4)}, dy:${String(dyF).padStart(4)}, a:'${cfg.a}'${dir} },\n`;
        });
      });
      out+='};\n';
      document.getElementById('output-text').value=out;
      document.getElementById('output-modal').classList.add('open');
    });

    document.getElementById('btn-clipboard').addEventListener('click',()=>{
      navigator.clipboard.writeText(document.getElementById('output-text').value).then(()=>{
        const b=document.getElementById('btn-clipboard');
        b.textContent='Copied!';
        setTimeout(()=>{ b.textContent='Copy to clipboard'; },2000);
      });
    });
    document.getElementById('btn-close-modal').addEventListener('click',()=>{
      document.getElementById('output-modal').classList.remove('open');
    });
  })
  .catch(err=>{
    svg.append('text').attr('x',530).attr('y',265).attr('text-anchor','middle')
       .attr('fill','#155240').attr('font-size',14)
       .text('⚠ Could not load map data. Please check your internet connection.');
    console.error(err);
  });
</script>
</body>
</html>
